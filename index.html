<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build AI Image Creator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <!--Header-->
        <header class="header">
            <div class="logo-wrapper">
                <div class="logo">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                </div>
                <h1> AI Image Generator</h1>
            </div>
            <button class="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
                <i class="fa-solid fa-moon"></i>
            </button>
        </header>
        <div class="main-content">
            <div class="prompt-form">
                <!--Prompt Input-->
                <textarea class="prompt-input" placeholder="Describe your imagination?" required autofocus></textarea>
                 <button type="button" class="prompt-btn">
                    <i class="fa-solid fa-brain"></i>
                 </button>
            </div>
            <!--Prompt action-->
            <div class="prompt-actions">
              <div class="select-wrapper">
                <select id="model-select" class="custom-select" aria-label="Select model" title="Select model" required>
                    <option value="" selected disabled>Aspect Ratio</option>
                    <option value="1/1">Square(1:1)</option>
                    <option value="16/9">Landscape(16:9)</option>
                    <option value="9/16">Portrait(9:16)</option>

                </select>

                </div>
            
              <div class="select-wrapper">
                   <select id="model-select" class="custom-select" aria-label="Select model" title="Select model" required>
                     <option value="" selected disabled>Select Mode</option>
                     <option value="black-forest-labs/FLUX.1">FLUX.1-dev</option>
                     <option value="black-forest-labs/FLUX.1-schnell">FLUX.1-schnell</option>
                     <option value="stabilityai/stable-diffusion">Stable Diffusion XL</option>
                     <option value="prompthero/openjourney">open journey</option>
                   </select>
              </div>
              <div class="select-wrapper">
                <select id="model-select" class="custom-select" aria-label="Select model" title="Select model" required>
                    <option value="" selected disabled>Image Count</option>
                    <option value="1">1 Image</option>
                    <option value="2">2 Image</option>
                    <option value="3">3 Image</option>
                    <option value="5">5 Image</option>
                    <option value="6">6 Image</option>
                </select>
              </div>
              <button type="submit" class="generate-btn">
                  <i class="fa-solid fa-wand-magic-sparkles"></i> Generate Image
                </button>
         </div>
         <!--Result Gallery Grid-->
         <div class="gallery-grid">
            <div class="img-card">
                <img src="./test.png" class="result-img" alt="Generated image" title="Generated image" />
                <div class="img-overlay">
                    <button class="img-download-btn">
                        <i class="fa-solid fa-download"></i>
                    </button>
                </div>
            </div>
            <div class="img-card">
                <img src="./test.png" class="result-img" alt="Generated image" title="Generated image" />
                <div class="img-overlay">
                    <button class="img-download-btn">
                        <i class="fa-solid fa-download"></i>
                    </button>
                </div>
            </div>
            <div class="img-card">
                <img src="./test.png" class="result-img" alt="Generated image" title="Generated image" />
                <div class="img-overlay">
                    <button class="img-download-btn">
                        <i class="fa-solid fa-download"></i>
                    </button>
                </div>
         </div>
         <div class="img-card">
                <img src="./test.png" class="result-img" alt="Generated image" title="Generated image" />
                <div class="img-overlay">
                    <button class="img-download-btn">
                        <i class="fa-solid fa-download"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
